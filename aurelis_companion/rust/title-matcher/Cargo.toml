[package]
name = "title-matcher"
version = "0.1.0"
edition = "2021"
description = "Title normalization, cache keys, edition group keys for catalogue matching. Pure library + JNI bridge."

[lib]
name = "title_matcher"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# Standalone for isolated `cargo test` — removed when added to the workspace.
