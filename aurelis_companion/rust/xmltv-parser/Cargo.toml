[package]
name = "xmltv-parser"
version = "0.1.0"
edition = "2021"
description = "Optional native XMLTV EPG parse engine for Aurelis's core/data XmltvParser. Pure parse-only, no long-lived state."

[lib]
name = "xmltv_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"


[build-dependencies]
sha2.workspace = true

[dev-dependencies]
sha2.workspace = true
