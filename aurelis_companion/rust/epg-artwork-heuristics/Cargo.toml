[package]
name = "epg-artwork-heuristics"
version = "0.1.0"
edition = "2021"
description = "Optional native port of EpgArtworkEnricher's two self-contained pure-compute steps: SxxExx title parsing and clean-backdrop selection. The rest of the class is TMDB/TVDB/Fanart network orchestration and stays Kotlin-side."

[lib]
name = "epg_artwork_heuristics"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

