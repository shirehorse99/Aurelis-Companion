[package]
name = "xtream-parser"
version = "0.1.0"
edition = "2021"
description = "Optional native Xtream Codes JSON parse engine for Aurelis's core/data XtreamParser. Pure parse-only, no long-lived state."

[lib]
name = "xtream_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
jni-cache = { path = "../jni-cache" }

