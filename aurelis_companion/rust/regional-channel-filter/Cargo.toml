[package]
name = "regional-channel-filter"
version = "0.1.0"
edition = "2021"
description = "Optional native port of Aurelis's core/common RegionalChannelFilter -- UK/US/EU postcode-to-broadcast-region lookup and channel-name regional-tag detection, run per-channel on every Local-tab render/arbiter pass."

[lib]
name = "regional_channel_filter"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

