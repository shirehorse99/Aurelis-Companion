[package]
name = "aurelis-heuristics"
version = "0.1.0"
edition = "2021"
description = "Shared Aurelis channel-name heuristics: normalization, country affinity, genre mapping, locale plans. Pure library + JNI bridge."

[lib]
name = "aurelis_heuristics"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"

