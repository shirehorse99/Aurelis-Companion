[package]
name = "m3u-parser"
version = "0.1.0"
edition = "2021"
description = "Optional native M3U playlist parse engine for Aurelis's core/data M3uParser. Pure parse-only, no long-lived state."

[lib]
name = "m3u_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha1 = "0.11"

