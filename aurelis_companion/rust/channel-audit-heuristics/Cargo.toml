[package]
name = "channel-audit-heuristics"
version = "0.1.0"
edition = "2021"
description = "Optional native port of ChannelCategoryAuditor's self-contained name-rescue/hint heuristics. Diagnostic-only, single-channel-at-a-time, no CPU payoff expected -- ported for completeness at explicit request."

[lib]
name = "channel_audit_heuristics"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

