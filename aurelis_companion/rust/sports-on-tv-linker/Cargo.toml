[package]
name = "sports-on-tv-linker"
version = "0.1.0"
edition = "2021"
description = "Optional native sports-on-TV EPG linker for Aurelis's core/domain sport logic. Pure text/time matching, no network calls, no long-lived state."

[lib]
name = "sports_on_tv_linker"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
