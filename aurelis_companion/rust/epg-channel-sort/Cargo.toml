[package]
name = "epg-channel-sort"
version = "0.1.0"
edition = "2021"
description = "Optional native channel-ordering engine for Aurelis's core/domain EpgChannelSort and ChannelCurationSort. Pure sort/cluster over caller-precomputed primitives, no long-lived state."

[lib]
name = "epg_channel_sort"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aurelis-heuristics = { path = "../aurelis-heuristics" }

