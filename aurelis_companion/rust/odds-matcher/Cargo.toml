[package]
name = "odds-matcher"
version = "0.1.0"
edition = "2021"
description = "Native team names matching and Levenshtein similarity matcher."

[lib]
name = "odds_matcher"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

