[package]
name = "bitrate-calc"
version = "0.1.0"
edition = "2021"
description = "Optional native HLS-manifest/throughput compute helpers for Aurelis's core/domain BitrateProbeService. Pure text/number crunching over an already-fetched response, no network calls, no long-lived state."

[lib]
name = "bitrate_calc"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

