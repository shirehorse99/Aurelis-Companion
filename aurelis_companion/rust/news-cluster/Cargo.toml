[package]
name = "news-cluster"
version = "0.1.0"
edition = "2021"
description = "Optional native headline-clustering engine for Aurelis's core/domain NewsClusterAggregator. Pure Levenshtein clustering over caller-precomputed strings, no long-lived state."

[lib]
name = "news_cluster"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

