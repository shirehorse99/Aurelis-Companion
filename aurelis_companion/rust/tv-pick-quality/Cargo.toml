[package]
name = "tv-pick-quality"
version = "0.1.0"
edition = "2021"
description = "TV pick quality scoring and title matching for Today's TV picks. Pure library + JNI bridge."

[lib]
name = "tv_pick_quality"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# Standalone for isolated `cargo test` — removed when added to the workspace.
