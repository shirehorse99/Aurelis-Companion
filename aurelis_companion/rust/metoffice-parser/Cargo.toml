[package]
name = "metoffice-parser"
version = "0.1.0"
edition = "2021"
description = "Native severe weather warnings Met Office RSS XML parser."

[lib]
name = "metoffice_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
regex = "1"

