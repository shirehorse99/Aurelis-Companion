[package]
name = "media-server-parser"
version = "0.1.0"
edition = "2021"
description = "Optional native Emby/Jellyfin media-server catalogue parse engine for Aurelis. Pure parse-only, no long-lived state."

[lib]
name = "media_server_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

